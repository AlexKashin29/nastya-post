<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Ты - моя вселенная</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b2352" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Для Насти" />
    <meta
      name="description"
      content="Игра для Насти от Саши: шесть глав письма и каждый день что-то новое."
    />
    <link rel="icon" href="./assets/heart.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="sky-bg" aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="./" aria-label="На главную"
        ><span class="brand-hand">Для Насти</span></a
      >
      <nav class="tabs-main" aria-label="Разделы">
        <button data-tab="adventure" aria-current="page">Путь</button
        ><button data-tab="today">
          Сегодня<span class="tab-badge" hidden></span></button
        ><button data-tab="games">Игры</button
        ><button data-tab="route">Маршрут</button
        ><button data-tab="wardrobe">Шкаф</button
        ><button data-tab="album">Альбом</button
        ><button data-tab="letter">Письмо</button>
      </nav>
      <div class="topbar-right">
        <span class="chip" id="dust-chip" title="Звёздная пыль"
          ><svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M7 4l1.2 2.8L11 8l-2.8 1.2L7 12 5.8 9.2 3 8l2.8-1.2zM16 10l1.6 3.4L21 15l-3.4 1.6L16 20l-1.6-3.4L11 15l3.4-1.6z"
              fill="currentColor"
            /></svg
          ><b id="dust">0</b></span
        ><span class="chip streak" id="streak-chip" title="Дней подряд"
          ><svg
            class="ic"
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          >
            <path
              d="M12 3c3 4 6.5 6.2 6.5 11a6.5 6.5 0 0 1-13 0c0-3 1.8-5 3-7 .8 2 2 3.2 3 3.2 0-3-1-5.4.5-7.2z"
            /></svg
          ><b id="streak">0</b></span
        ><button
          id="sound"
          class="icon-button"
          aria-label="Включить звук"
          aria-pressed="false"
        >
          <svg
            class="ic"
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          >
            <path d="M9 18V5.5l10-2v12.5" />
            <circle cx="6.5" cy="18" r="2.5" />
            <circle cx="16.5" cy="16" r="2.5" /></svg></button
        ><button id="settings" class="icon-button" aria-label="Настройки">
          <svg
            class="ic"
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M5.6 18.4l1.6-1.6M16.8 7.2l1.6-1.6"
            />
          </svg>
        </button>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <div class="loading">
        <div class="skeleton wide"></div>
        <div class="skeleton"></div>
      </div>
    </main>
    <footer class="foot">
      <span id="save-status">Прогресс сохраняется сам</span
      ><span>Саша, Настя и Персик</span>
    </footer>
    <nav class="mobile-nav" aria-label="Разделы">
      <button data-tab="adventure" aria-current="page">
        <svg
          class="ic"
          viewBox="0 0 24 24"
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M4 6.5l5-2 6 2 5-2v13l-5 2-6-2-5 2z" />
          <path d="M9 4.5v13M15 6.5v13" /></svg
        >Путь</button
      ><button data-tab="today">
        <svg
          class="ic"
          viewBox="0 0 24 24"
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        >
          <rect x="4" y="5.5" width="16" height="14.5" rx="2" />
          <path d="M4 9.5h16M8.5 3.5v4M15.5 3.5v4" /></svg
        >Сегодня<span class="tab-badge" hidden></span></button
      ><button data-tab="games">
        <svg
          class="ic"
          viewBox="0 0 24 24"
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M7 8h10a4 4 0 0 1 4 4v1.5a3 3 0 0 1-5.5 1.7L14.5 14h-5L8.5 15.2A3 3 0 0 1 3 13.5V12a4 4 0 0 1 4-4z"
          />
          <path d="M8 11v3M6.5 12.5h3M15.5 11.5h.1M17.5 13h.1" /></svg
        >Игры</button
      ><button data-tab="wardrobe">
        <svg
          class="ic"
          viewBox="0 0 24 24"
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M10 7.5a2 2 0 1 1 2.6 1.9c-.4.1-.6.5-.6.9v.7L3.5 16.5h17L12 11"
          /></svg
        >Шкаф</button
      ><button data-tab="album">
        <svg
          class="ic"
          viewBox="0 0 24 24"
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        >
          <path d="M5 4.5h11a3 3 0 0 1 3 3v12H8a3 3 0 0 1-3-3z" />
          <path d="M5 16.5a3 3 0 0 1 3-3h11" /></svg
        >Альбом</button
      >
    </nav>
    <dialog id="modal" aria-labelledby="modal-title">
      <button id="close-modal" class="close" aria-label="Закрыть">×</button>
      <div id="modal-content"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="./vault.js" defer></script>
    <script src="./inbox.js" defer></script>
    <script src="./engine.js" defer></script>
    <script src="./share.js" defer></script>
    <script src="./persik.js" defer></script>
    <script src="./arcade-logic.js" defer></script>
    <script src="./arcade.js" defer></script>
    <script src="./script.js" defer></script>
  </body>
</html>
